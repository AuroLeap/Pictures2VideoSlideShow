[package]
name = "slideshow-core"
version = "0.1.0"
edition = "2021"

[dependencies]
image = "0.25"
imageproc = "0.25"
# SIMD (SSE4.1/AVX2, runtime-detected) resize for the prescale and the
# rotation-off render fast path (LLR-061, plan §3 1c): several times faster
# than the generic per-pixel warp/resize for the axis-aligned common case.
fast_image_resize = "5"
rayon = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.4"
sha2 = "0.10"
# GPU render backend (SR-039, LLR-074): safe Rust over DX12/Vulkan — the
# per-machine adapter pick needs no SDK/toolchain on end-user machines.
# Heaviest dep in the tree (naga shader compiler included) — accepted against
# removing the 57.3% rot-15 render share; features trimmed to dx12+vulkan+wgsl
# (no GLES/Metal/WebGPU) to cap compile time and binary size.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "wgsl"] }
# Pod casts for the GPU FrameUniforms and staging-buffer readback (LLR-074).
bytemuck = { version = "1", features = ["derive"] }
# Minimal block_on for wgpu's async adapter/device/map calls — no tokio (LLR-074).
pollster = "1"

[[bin]]
name = "make_video_slideshow"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
