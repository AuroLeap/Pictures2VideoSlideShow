[package]
name = "slideshow-core"
version = "0.1.0"
edition = "2021"

[dependencies]
image = "0.25"
imageproc = "0.25"
# SIMD (SSE4.1/AVX2, runtime-detected) resize for the prescale and the
# rotation-off render fast path (LLR-061, plan §3 1c): several times faster
# than the generic per-pixel warp/resize for the axis-aligned common case.
fast_image_resize = "5"
rayon = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.4"
sha2 = "0.10"

[[bin]]
name = "make_video_slideshow"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
