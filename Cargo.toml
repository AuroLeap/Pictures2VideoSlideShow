[package]
name = "slideshow-core"
version = "0.1.0"
edition = "2021"

[dependencies]
image = "0.24"
imageproc = "0.23"
rayon = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.4"
sha2 = "0.10"

[[bin]]
name = "make_video_slideshow"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
